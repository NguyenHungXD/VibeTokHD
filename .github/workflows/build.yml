name: Build Full IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ${{ github.workspace }}/theos
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
          echo "PATH=${{ github.workspace }}/theos/bin:$PATH" >> $GITHUB_ENV
          # Install ldid for signing
          brew install ldid
          ls ${{ github.workspace }}/theos/
          ${{ github.workspace }}/theos/bin/nic.pl --help 2>&1 | head -3

      - name: Build dylib
        run: |
          cd ${{ github.workspace }}
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          # Build tweak
          make package FINALPACKAGE=1
          echo "Make exit: $?"
          ls -la
          find . -name "*.dylib" 2>/dev/null
          find . -name "*.deb" 2>/dev/null

      - name: Find dylib
        id: find_dylib
        run: |
          cd ${{ github.workspace }}
          DYLIB=$(find . -name "VibeTokHD.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: VibeTokHD.dylib not found"
            echo "Looking for any dylib..."
            find . -name "*.dylib" 2>/dev/null
            echo "Looking for any deb..."
            find . -name "*.deb" 2>/dev/null
            exit 1
          fi
          echo "DYLIB=$DYLIB" >> $GITHUB_OUTPUT
          echo "Found: $DYLIB"

      - name: Download original TikTok.ipa
        env:
          VIBETOK_IPA_URL: ${{ secrets.VIBETOK_IPA_URL }}
        run: |
          if [ -z "$VIBETOK_IPA_URL" ]; then
            echo "ERROR: VIBETOK_IPA_URL secret not set"
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/build
          cd ${{ github.workspace }}/build
          echo "Downloading from: $VIBETOK_IPA_URL"
          curl -L -o TikTok.ipa "$VIBETOK_IPA_URL"
          echo "=== Downloaded file ==="
          ls -la
          file TikTok.ipa
          # Verify it is a valid IPA (iOS App Zip)
          if ! file TikTok.ipa | grep -q "iOS App Zip"; then
            echo "WARNING: Downloaded file may not be a valid IPA"
          fi

      - name: Inject tweak into IPA
        run: |
          cd ${{ github.workspace }}/build

          # Get info on the original IPA structure
          echo "=== Original IPA structure ==="
          unzip -l TikTok.ipa | head -10
          echo "..."

          # Method 1: Use zip's update feature to add dylib to existing ZIP
          # This preserves the original compression and file structure

          # First copy dylib to a temp location
          DYLIB_PATH=$(find ${{ github.workspace }} -name "VibeTokHD.dylib" 2>/dev/null | head -1)
          ls -la "$DYLIB_PATH"

          # Extract just the dylib into a working directory
          mkdir -p Frameworks
          cp "$DYLIB_PATH" Frameworks/VibeTok.dylib
          ls -la Frameworks/

          # Sign the dylib
          codesign --force --sign - Frameworks/VibeTok.dylib

          # Use zip update: copy IPA, add dylib to it
          # This preserves the original ZIP structure
          cp TikTok.ipa VibeTokHD-signed.ipa

          # Add dylib to existing ZIP (preserves original compression)
          # -X strips extra attributes, -r recursive, -0 store
          zip -X -0 VibeTokHD-signed.ipa Frameworks/VibeTok.dylib

          # But this puts Frameworks/ at root, not inside Payload/TikTok.app/Frameworks/
          # We need to delete and re-add with correct path

          # Method 2: Properly re-zip with directory structure
          rm VibeTokHD-signed.ipa
          rm -rf extracted

          # Extract original
          unzip -q TikTok.ipa -d extracted

          # Inject dylib
          mkdir -p "extracted/Payload/TikTok.app/Frameworks"
          cp Frameworks/VibeTok.dylib "extracted/Payload/TikTok.app/Frameworks/VibeTok.dylib"

          # Re-zip using COPY method (no recompression)
          # -0 = store only, -X = strip extras
          cd extracted
          # Use Python's zipfile to preserve everything
          python3 -c "
          import zipfile
          import os

          out_zip = '../VibeTokHD-signed.ipa'

          # Read original IPA to preserve compression info
          with zipfile.ZipFile('../../TikTok.ipa', 'r') as orig:
              with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_STORED) as out:
                  for item in orig.infolist():
                      # Read file from extracted dir
                      file_path = os.path.join('.', item.filename)
                      if os.path.exists(file_path):
                          with open(file_path, 'rb') as f:
                              data = f.read()
                          # Preserve original info but allow VibeTok.dylib
                          new_info = zipfile.ZipInfo(item.filename, date_time=item.date_time)
                          new_info.compress_type = item.compress_type
                          new_info.external_attr = item.external_attr
                          out.writestr(new_info, data)
                      else:
                          print(f'Warning: missing {item.filename}')

                  # Add VibeTok.dylib
                  vhd_path = 'Payload/TikTok.app/Frameworks/VibeTok.dylib'
                  if os.path.exists(vhd_path):
                      with open(vhd_path, 'rb') as f:
                          data = f.read()
                      new_info = zipfile.ZipInfo(vhd_path, date_time=(2026, 10, 3, 0, 0, 0))
                      new_info.compress_type = zipfile.ZIP_STORED
                      out.writestr(new_info, data)
                      print(f'Added {vhd_path}')

          print('Done!')
          "
          cd ..

          echo "=== File sizes ==="
          ls -la *.ipa

          echo "=== Verify integrity ==="
          file VibeTokHD-signed.ipa
          unzip -t VibeTokHD-signed.ipa | tail -3

          # Check that VibeTok.dylib is inside
          unzip -l VibeTokHD-signed.ipa | grep VibeTok

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-IPA
          path: ${{ github.workspace }}/build/VibeTokHD-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo "Build process completed"
          echo "========================================"