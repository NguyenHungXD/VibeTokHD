name: Build VibeTokHD Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + ldid
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # Install ldid for code signing
          brew install ldid 2>&1 | tail -5 || echo "brew install failed, trying alternate"
          # Alternate: try downloading ldid binary directly
          if ! command -v ldid &>/dev/null; then
            curl -L -o $HOME/ldid https://github.com/ProcursusTeam/Procursus/raw/main/misc/ldid
            chmod +x $HOME/ldid
            echo "PATH=$HOME:$PATH" >> $GITHUB_ENV
          fi
          ldid 2>&1 || echo "ldid status check"

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package
          ls -la packages/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-deb
          path: packages/*.deb