name: Build Full IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ${{ github.workspace }}/theos
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
          export PATH=$THEOS/bin:$PATH

      - name: Build dylib
        run: |
          cd ${{ github.workspace }}
          make package FINALPACKAGE=1
          ls -la
          find . -name "*.dylib" 2>/dev/null

      - name: Find dylib
        id: find_dylib
        run: |
          cd ${{ github.workspace }}
          DYLIB=$(find . -name "VibeTokHD.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: VibeTokHD.dylib not found"
            exit 1
          fi
          echo "DYLIB=$DYLIB" >> $GITHUB_OUTPUT
          echo "Found: $DYLIB"

      - name: Download original TikTok.ipa
        env:
          VIBETOK_IPA_URL: ${{ secrets.VIBETOK_IPA_URL }}
        run: |
          if [ -z "$VIBETOK_IPA_URL" ]; then
            echo "ERROR: VIBETOK_IPA_URL secret not set"
            echo "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/build
          cd ${{ github.workspace }}/build
          curl -L -o TikTok.ipa "$VIBETOK_IPA_URL"
          ls -la
          file TikTok.ipa

      - name: Inject tweak into IPA
        run: |
          cd ${{ github.workspace }}/build
          unzip -q TikTok.ipa -d extracted

          # Patch Info.plist if needed (add Substrate filter)
          PLIST="extracted/Payload/TikTok.app/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Patching Info.plist..."
            # Add Substrate filter via PlistBuddy (macOS only)
            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:MobileSubstrate  string true" "$PLIST" 2>/dev/null || true
          fi

          # Copy dylib
          DYLIB_PATH=$(find ${{ github.workspace }} -name "VibeTokHD.dylib" 2>/dev/null | head -1)
          mkdir -p "extracted/Payload/TikTok.app/Frameworks"
          cp "$DYLIB_PATH" "extracted/Payload/TikTok.app/Frameworks/VibeTok.dylib"

          # Show structure
          ls -la extracted/Payload/TikTok.app/Frameworks/

          # Sign the dylib (ad-hoc)
          codesign --force --sign - "extracted/Payload/TikTok.app/Frameworks/VibeTok.dylib"

          # Re-zip
          cd extracted
          zip -qr ../VibeTokHD-signed.ipa Payload/
          cd ..
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-IPA
          path: ${{ github.workspace }}/build/VibeTokHD-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Download VibeTokHD-IPA from:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Install via:"
          echo "  - Sideloadly (Windows): kéo IPA vào, đăng nhập Apple ID"
          echo "  - AltStore (iPhone): install qua My Apps"
          echo "  - TrollStore (nếu iOS 15+)"
          echo ""