name: Build VibeTokHD Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # Theos - jailbreak dev toolkit
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package
          ls -la packages/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-deb
          path: packages/*.deb